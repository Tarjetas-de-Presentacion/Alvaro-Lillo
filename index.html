<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álvaro Lillo Sepúlveda - Tarjeta Digital</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background-color: #f5f5f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            height: 100dvh; 
            padding: 8px; 
            overflow: hidden; 
        }

        .container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 380px; 
            max-height: 100dvh;
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            padding: 0 16px 14px 16px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* Barra de 3 segmentos iguales (1/3 cada uno) con los colores del isotipo NEINGEN:
           Gris Grafito Oscuro (#3A3D40), Turquesa Teal Corporativo (#007A87), Teal Claro/Brillante (#0A9396) */
        .top-bar { 
            display: flex; 
            height: 4px; 
            width: 100%; 
            margin: 8px 0 10px 0; 
            border-radius: 3px; 
            overflow: hidden; 
            flex-shrink: 0; 
        }
        .bar-1 { background-color: #3A3D40; flex: 1; } /* Gris Grafito */
        .bar-2 { background-color: #007A87; flex: 1; } /* Turquesa Teal */
        .bar-3 { background-color: #0A9396; flex: 1; } /* Teal Claro */
        
        .card-header { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            padding: 12px 14px; 
            position: relative; 
            margin-bottom: 8px; 
        }
        
        .logo-wrapper { 
            display: flex; 
            justify-content: flex-end; 
            margin-bottom: 6px; 
        }
        .logo-img { 
            max-width: 42px; 
            max-height: 42px;
            height: auto; 
            display: block; 
            object-fit: contain; 
            border-radius: 4px;
        }
        .logo-svg-fallback {
            width: 38px;
            height: 38px;
            display: none;
        }
        
        h1 { 
            font-size: 1.2rem; 
            color: #0f172a; 
            font-weight: 700; 
            margin-bottom: 2px; 
        }
        .subtitle { 
            font-size: 0.82rem; 
            color: #007A87; 
            font-weight: 600; 
            line-height: 1.2; 
            margin-bottom: 4px; 
        }
        .description { 
            font-size: 0.72rem; 
            color: #64748b; 
            line-height: 1.2; 
            margin-bottom: 8px; 
        }
        
        .contact-info { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            font-size: 0.78rem; 
            border-top: 1px solid #e2e8f0; 
            padding-top: 8px; 
        }
        .contact-info a { 
            color: #334155; 
            text-decoration: none; 
            font-weight: 500; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: color 0.15s ease;
        }
        .contact-info a:hover {
            color: #007A87;
        }
        .contact-icon { 
            font-size: 0.85rem; 
            opacity: 0.8; 
        }
        
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            width: 100%; 
            padding: 10px; 
            border-radius: 10px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            text-decoration: none; 
            margin-bottom: 6px; 
            border: none; 
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-main { 
            background: #3A3D40; 
            color: #ffffff; 
        }
        .btn-main:hover {
            background: #2D3033;
        }
        .btn-whatsapp { 
            background: #25d366; 
            color: #ffffff; 
        }
        .btn-whatsapp:hover {
            background: #20bd5a;
        }
        .grid-btns { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
            margin-bottom: 8px; 
        }
        .btn-secondary { 
            background: #f1f5f9; 
            color: #1e293b; 
            font-size: 0.78rem; 
            padding: 8px; 
            border: 1px solid #e2e8f0; 
            margin-bottom: 0; 
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        .qr-section { 
            text-align: center; 
            border-top: 1px solid #f1f5f9; 
            padding-top: 8px; 
        }
        .qr-title { 
            font-size: 0.62rem; 
            color: #64748b; 
            letter-spacing: 1px; 
            font-weight: 700; 
            margin-bottom: 6px; 
        }
        .qr-box { 
            background: white; 
            padding: 6px; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            display: inline-block; 
        }
        .qr-box img { 
            width: 95px; 
            height: 95px; 
            display: block; 
        }
        .footer-text { 
            font-size: 0.62rem; 
            color: #94a3b8; 
            margin-top: 4px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Barra de 3 segmentos con paleta corporativa de NEINGEN -->
        <div class="top-bar">
            <div class="bar-1"></div>
            <div class="bar-2"></div>
            <div class="bar-3"></div>
        </div>

        <div class="card-header">
            <div class="logo-wrapper">
                <!-- Imagen Isotipo subida -->
                <img src="IMG_4851.JPG" alt="Isotipo NEINGEN" class="logo-img" id="main-logo" onerror="showFallbackLogo()">
                <!-- Fallback SVG estilizado con la geometría exacta de la N en caso de que falle la carga -->
                <svg id="svg-fallback" class="logo-svg-fallback" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 25 L35 15 L35 85 L15 75 Z" fill="#3A3D40" />
                    <path d="M15 25 L85 75 L65 85 L15 25 Z" fill="#2D3033" />
                    <path d="M15 25 L65 15 L85 75 L35 85 Z" fill="#007A87" />
                    <path d="M65 15 L85 25 L85 75 L65 85 Z" fill="#3A3D40" />
                </svg>
            </div>

            <h1>Álvaro Lillo Sepúlveda </h1>
            <div class="subtitle">Subgerente de Adminitración y Finanzas | MALPO S.A.</div>
            <div class="description">Ingeniero Civil Industrial | Magíster en Gestión Tecnológica</div>
            
            <div class="contact-info">
                <a href="tel:+56993455594"><span class="contact-icon">📞</span> +56 9 9345 5594</a>
                <a href="mailto:contacto@neingen.cl"><span class="contact-icon">✉️</span> contacto@neingen.cl</a>
                <a href="https://www.neingen.cl" target="_blank" rel="noopener"><span class="contact-icon">🌐</span> www.neingen.cl</a>
            </div>
        </div>

        <!-- Botón interactivo para guardar en contactos -->
        <button onclick="downloadVCard()" class="btn btn-main">📇 Guardar en Contactos</button>
        <a href="https://wa.me/56993455594?text=Hola%20Williams,%20un%20gusto%20contactarte." target="_blank" rel="noopener" class="btn btn-whatsapp">💬 Mensaje por WhatsApp</a>

        <div class="grid-btns">
            <a href="mailto:contacto@malpo.cl" class="btn btn-secondary">✉️ Correo</a>
            <a href="https://www.malpo.cl" target="_blank" rel="noopener" class="btn btn-secondary">🌐 Sitio Web</a>
            <a href="https://www.linkedin.com/in/alvaro-lillo-sepulveda/" target="_blank" rel="noopener" class="btn btn-secondary">🔗 LinkedIn</a>
            <a href="tel:+56993455594" class="btn btn-secondary">📞 Llamar</a>
        </div>

        <div class="qr-section">
            <div class="qr-title">ESCANEAR PARA COMPARTIR</div>
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://tarjetas-de-presentacion.github.io/Williams-Neira/" alt="Código QR Williams Neira">
            </div>
            <div class="footer-text">© neingen.cl</div>
        </div>
    </div>

    <script>
        // Muestra el logo SVG fallback si la imagen IMG_4851.JPG no se puede cargar localmente
        function showFallbackLogo() {
            document.getElementById('main-logo').style.display = 'none';
            document.getElementById('svg-fallback').style.display = 'block';
        }

        // Genera y descarga el archivo vCard para guardar el contacto en cualquier smartphone
        function downloadVCard() {
            const vcardData = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'N:Neira Garrido;Williams;;;',
                'FN:Williams Neira Garrido',
                'ORG:NEINGEN SpA',
                'TITLE:Gerente General',
                'TEL;TYPE=CELL,VOICE:+56993455594',
                'EMAIL;TYPE=INTERNET,WORK:contacto@neingen.cl',
                'URL:https://www.neingen.cl',
                'NOTE:Ingeniero Civil Industrial | Magíster en Gestión Tecnológica',
                'END:VCARD'
            ].join('\n');

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'williams_neira.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
